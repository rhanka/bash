name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ACTION_SHA_CHECKOUT
      - name: Install the Rust toolchain named by rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@ACTION_SHA_SETUP_NODE
        with:
          node-version: 22
      - uses: actions/cache@ACTION_SHA_CACHE
        with:
          path: tmp/tools
          key: tools-${{ hashFiles('tools/pins.json', 'tools/package-lock.json') }}
      - run: node tools/fetch-tools.mjs
      - run: make check
